<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make-It-All | Register</title>

<!-- CDNs -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!-- Style Sheet -->
<link rel="stylesheet" href="../styles/style.css">

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="/index.html"><img src="/assets/MakeItAllLogo.png" width="30" height="30" alt=""></a>
                <a class="navbar-brand" href="/index.html">Make-It-All Ltd</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li class="nav-item active"><a href="/frontend/pages/login.html" class="nav-btn">Login</a></li>
                <li class="nav-item active"><a href="/frontend/pages/register.html" class="nav-btn">Register</a></li>
                <li class="nav-item active"><a href="/index.html" class="nav-btn">Home</a></li>
                <li class="nav-item active"><a href="/frontend/pages/employee.html" class="nav-btn">Dashboards</a></li>
            </ul>
        </div>
    </nav>

    <!-- Register Functionality -->
    <div class="security-container">
        <img src="../../assets/MakeItAllLogo.png" alt="Make-It-All logo" class="logo">
        <h2>Register to Make-It-All</h2>

        <form id="registerForm">
            <input type="email" id="email" placeholder="Your email" required>
            <input type="password" id="password" placeholder="Enter password" required>
            <input type="password" id="password-2" placeholder="Enter password again" required>

            <p class="error" id="errorMessage"></p>

            <button type="submit" id="registerButton">Register</button>
            <button type="button" id="forgotPassword" style="margin-top:10px;">Forgot Password?</button>
        </form>

    </div>

    <!-- Footer -->
    <div class="footer text-center mt-auto">
        <div class="container">
            <p>Make-It-All Ltd | Team 27 Project</p>
        </div>
    </div>

    <script>

        const registerForm = document.getElementById("registerForm");
        const registerButton = document.getElementById("registerButton");
        const errorMessage = document.getElementById("errorMessage");

        registerForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const password2 = document.getElementById("password-2").value.trim();

            if (email === "" || password === "" || password2 === "") {
                errorMessage.textContent = "Please fill in all fields.";
                return;
            }

            if (password !== password2) {
                errorMessage.textContent = "Passwords do not match.";
                return;
            }

            errorMessage.textContent = "";
            alert("Registration successful! Please log in.");
            window.location.href = "login.html";
        });

    </script>

</body>
</html>
