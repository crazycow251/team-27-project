<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make It All Dashboard</title>

    <!-- CDNs -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Style Sheet -->
    <link rel="stylesheet" href="frontend/styles/style.css">

</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="index.html">Make-It-All Ltd</a>
            </div>
            <ul class="nav navbar-nav navbar-right">
                <li class="nav-item active"><a href="" class="nav-btn">Home</a></li>
                <li class="nav-item active"><a href="" class="nav-btn">Dashboards</a></li>
                <li class="nav-item active"><a href="" class="nav-btn">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard Main Content -->
    <div class="flex-grow-1 main-content dashboard-main">
        <div class="container text-center">
            <h1 id="dashboard-title">Dashboard</h1>

            <!-- Project Overview -->
            <div id="dashboard-projects" class="projects">
                <h2 class="dashboard-section-title">Active Projects:</h2>
                <h3 class="dashboard-count dashboard-active">3</h3>

                <h2 class="dashboard-section-title">Completed Projects:</h2>
                <h3 class="dashboard-count dashboard-completed">5</h3>

                <h2 class="dashboard-section-title">Overdue Projects:</h2>
                <h3 class="dashboard-count dashboard-overdue">1</h3>
            </div>

            <!-- Filters -->
            <div id="dashboard-filters" class="filtersBox">
                <div class="filterHeader">
                    <h2 id="dashboard-filters-title">Filters</h2>
                </div>
                <div class="filterBody">
                    <label class="projLab">Project</label>
                    <select class="projSelect">
                        <option selected>All Projects</option>
                        <option>Project A</option>
                        <option>Project B</option>
                        <option>Project C</option>
                        <option>Project D</option>
                        <option>Project E</option>
                    </select>
                </div>
                <div class="filterBody">
                    <label class="teamLab">Team</label>
                    <select class="teamSelect">
                        <option selected>All Teams</option>
                        <option>Worker A</option>
                        <option>Worker B</option>
                        <option>Worker C</option>
                        <option>Worker D</option>
                        <option>Worker E</option>
                    </select>
                </div>
                <button class="applyBtn">Apply Filters</button>
            </div>

            <!-- Add Task -->
            <div id="dashboard-addtask" class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Add a New Task</h5>
                    <form id="task-form" class="row g-2">
                        <div class="col-md-5">
                            <input type="text" id="taskName" class="form-control" placeholder="Task Name" required>
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="taskProject" class="form-control" placeholder="Team Name" required>
                        </div>
                        <div class="col-md-3">
                            <input type="date" id="taskDate" class="form-control" placeholder="Due date" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Add Task</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Task List -->
            <div id="dashboard-tasks" class="card mb-4">
                <div class="card-body">
                    <h5>Your Tasks</h5>
                    <ul id="task-list" class="list-group"></ul>
                </div>
            </div>

            <!-- Charts -->
            <div id="dashboard-charts" class="charts row">
                <div class="col-md-6 progressChart">
                    <h2 class="workloadtitle">Team Workload Distribution</h2>
                    <canvas class="wlc" id="workloadChart"></canvas>
                </div>
                <div class="col-md-6 progressChart">
                    <h2 class="progressTitle">Overall Project Progress</h2>
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer text-center mt-auto">
        <div class="container">
            <p>Make-It-All Ltd | Team 27 Project</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart Scripts -->
    <script>
        const workload = document.getElementById('workloadChart');
        const progressCtx = document.getElementById('progressChart');

        new Chart(progressCtx, {
            type: 'bar',
            data: {
                labels: ['Project A', 'Project B', 'Project C', 'Project D', 'Project E'],
                datasets: [{
                    label: 'Completion %',
                    data: [75, 40, 90, 60, 55],
                    backgroundColor: 'rgba(13, 110, 253, 0.7)'
                }]
            },
            options: {
                responsive: true,
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });

        new Chart(workload, {
            type: 'pie',
            data: {
                labels: ['Worker A', 'Worker B', 'Worker C', 'Worker D', 'Worker E'],
                datasets: [{
                    data: [12, 8, 5, 7, 10],
                    backgroundColor: ['#0d6efd', '#198754', '#fd7e14', '#6f42c1', '#dc3545']
                }]
            },
            options: { responsive: true }
        });
    </script>

    <!-- Task Script -->
    <script type="module">
        const form = document.getElementById("task-form");
        const taskList = document.getElementById("task-list");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const desc = document.getElementById("taskName").value;
            const project = document.getElementById("taskProject").value;
            const dateValue = document.getElementById("taskDate").value;
            const [year, month, day] = dateValue.split("-");
            const formattedDate = `${day}/${month}/${year}`;
            const today = new Date();
            const due = new Date(dateValue);
            const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));

            let tag = "Due Soon";
            let color = "bg-info text-dark";

            if (diffDays < 0) { tag = "Overdue"; color = "bg-danger"; }
            else if (diffDays <= 14) { tag = "Urgent"; color = "bg-warning text-dark"; }
            else if (diffDays >= 30) { tag = "Upcoming"; color = "bg-success"; }

            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
                <div>
                    <strong>${desc}</strong><br>
                    <small class="text-muted">Project: ${project} | Due: ${formattedDate}</small>
                </div>
                <div>
                    <span class="badge ${color}">${tag}</span>
                    <button class="btn btn-sm btn-outline-danger ms-2 delete-task">✕</button>
                </div>
            `;

            taskList.appendChild(li);
            form.reset();

            li.querySelector(".delete-task").addEventListener("click", () => { li.remove(); });
        });
    </script>
</body>
</html>
