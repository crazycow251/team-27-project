<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make-It-All Productivity System</title>

  <!-- CDNs -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Style Sheet -->
  <link rel="stylesheet" href="../styles/style.css">

</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-default navbar-fixed-top">
      <div class="container">
          <div class="navbar-header">
              <a class="navbar-brand" href="/index.html"><img src="/assets/MakeItAllLogo.png" width="30" height="30" alt=""></a>
              <a class="navbar-brand" href="/index.html">Make-It-All Ltd</a>
          </div>
          <ul class="nav navbar-nav navbar-right">
              <li class="nav-item active"><a href="" class="nav-btn">Login</a></li>
              <li class="nav-item active"><a href="" class="nav-btn">Home</a></li>
              <li class="nav-item active"><a href="" class="nav-btn">Dashboards</a></li>
              <li class="nav-item active"><a href="" class="nav-btn">Contact</a></li>
          </ul>
      </div>
  </nav>

  <!-- Login Functionality -->
  <div class="login-container">
    <img src="../../assets/MakeItAllLogo.png" alt="Make-It-All logo" class="logo">
    <h2>Login to Make-It-All</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Your email" required>
      <input type="password" id="password" placeholder="Enter password" required>

      <div class="show-password-container" style="text-align:left; margin-bottom:10px;">
        <input type="checkbox" id="showPassword">
        <label for="showPassword">Show Password</label>
      </div>

      <p class="error" id="errorMessage"></p>

      <button type="submit" id="loginButton">Login</button>
      <button type="button" id="forgotPassword" style="margin-top:10px;">
        Forgot Password?
      </button>
    </form>

    <form id="managerForm" style="display:none;">
      <input type="text" id="managerCode" placeholder="Enter your manager code please" required>
      <button type="submit">Submit</button>
      <p class="error" id="managerError"></p>
    </form>
  </div>

  <!-- Footer -->
  <div class="footer text-center mt-auto">
      <div class="container">
          <p>Make-It-All Ltd | Team 27 Project</p>
      </div>
  </div>

  <script>
    const users = {
      "manager@makeItAll": { password: "Manager123", role: "Manager", managerCode: "Code123" },
      "employee@makeItAll": { password: "Employee123", role: "Employee" }
    };

    let loginAttempts = 0;
    const maxAttempts = 3;
    const lockoutTime = 60; 
    let timeRemaining = 0;
    let lockoutTimer = null;

    const loginForm = document.getElementById("loginForm");
    const managerForm = document.getElementById("managerForm");
    const errorMessage = document.getElementById("errorMessage");
    const managerError = document.getElementById("managerError");
    const loginButton = document.getElementById("loginButton");
    const forgotPassword = document.getElementById("forgotPassword");

    document.getElementById("showPassword").addEventListener("change", function() {
      const passwordField = document.getElementById("password");
      passwordField.type = this.checked ? "text" : "password";
    });

    forgotPassword.addEventListener("click", () => {
      alert("The password reset instructions would be sent to your email.");
    });

    function startLockout() {
      timeRemaining = lockoutTime;
      loginButton.disabled = true;
      forgotPassword.disabled = true;
      document.getElementById("email").disabled = true;
      document.getElementById("password").disabled = true;

      lockoutTimer = setInterval(() => {
        errorMessage.textContent = `Too many failed attempts. Account locked for ${timeRemaining} second(s).`;
        timeRemaining--;

        if (timeRemaining < 0) {
          clearInterval(lockoutTimer);
          errorMessage.textContent = "";
          loginButton.disabled = false;
          forgotPassword.disabled = false;
          document.getElementById("email").disabled = false;
          document.getElementById("password").disabled = false;
          loginAttempts = 0;
        }
      }, 1000);
    }

    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (users[email] && users[email].password === password) {
        loginAttempts = 0;
        errorMessage.textContent = "";

        const role = users[email].role;
        if (role === "Manager") {
          loginForm.style.display = "none";
          managerForm.style.display = "block";
          sessionStorage.setItem("tempManager", email);
        } else {
          alert("Successful Login.");
          window.location.href = "dashboard.html";
        }
      } else {
        loginAttempts++;
        if (loginAttempts >= maxAttempts) {
          startLockout();
        } else {
          const remaining = maxAttempts - loginAttempts;
          errorMessage.textContent = `Invalid email or password. You have ${remaining} attempt(s) remaining.`;
        }
      }
    });

    managerForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const managerCode = document.getElementById("managerCode").value.trim();
      const email = sessionStorage.getItem("tempManager");

      if (email && users[email].managerCode === managerCode) {
        managerError.textContent = "";
        alert("login successfull");
        window.location.href = "manager.html";
      } else {
        managerError.textContent = "Invalid manager code.";
      }
    });
  </script>
</body>
</html>
